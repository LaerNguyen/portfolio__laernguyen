<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Digital Clock - Multiple Time Zones</title>\n    <link rel=\"stylesheet\" href=\"clock-styles.css\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n</head>\n<body>\n    <!-- Navigation Back to Portfolio -->\n    <nav class=\"navbar\">\n        <div class=\"container\">\n            <a href=\"index.html\" class=\"back-link\">← Back to Portfolio</a>\n            <h1 class=\"title\">Global Digital Clock</h1>\n        </div>\n    </nav>\n\n    <!-- Main Container -->\n    <div class=\"container\">\n        <div class=\"clock-section\">\n            <h2>Current Time in Different Time Zones</h2>\n            \n            <!-- Timezone Selection -->\n            <div class=\"timezone-controls\">\n                <label for=\"timezone-select\">Add Time Zone:</label>\n                <select id=\"timezone-select\">\n                    <option value=\"\">Select a timezone...</option>\n                    <option value=\"America/New_York\">New York (EST/EDT)</option>\n                    <option value=\"America/Chicago\">Chicago (CST/CDT)</option>\n                    <option value=\"America/Denver\">Denver (MST/MDT)</option>\n                    <option value=\"America/Los_Angeles\">Los Angeles (PST/PDT)</option>\n                    <option value=\"Europe/London\">London (GMT/BST)</option>\n                    <option value=\"Europe/Paris\">Paris (CET/CEST)</option>\n                    <option value=\"Europe/Berlin\">Berlin (CET/CEST)</option>\n                    <option value=\"Asia/Tokyo\">Tokyo (JST)</option>\n                    <option value=\"Asia/Shanghai\">Shanghai (CST)</option>\n                    <option value=\"Asia/Hong_Kong\">Hong Kong (HKT)</option>\n                    <option value=\"Asia/Bangkok\">Bangkok (ICT)</option>\n                    <option value=\"Asia/Kolkata\">India (IST)</option>\n                    <option value=\"Australia/Sydney\">Sydney (AEDT/AEST)</option>\n                    <option value=\"Pacific/Auckland\">Auckland (NZDT/NZST)</option>\n                    <option value=\"Asia/Dubai\">Dubai (GST)</option>\n                    <option value=\"Asia/Singapore\">Singapore (SGT)</option>\n                    <option value=\"America/Toronto\">Toronto (EST/EDT)</option>\n                    <option value=\"America/Mexico_City\">Mexico City (CST/CDT)</option>\n                    <option value=\"America/Sao_Paulo\">São Paulo (BRT/BRST)</option>\n                    <option value=\"Africa/Johannesburg\">Johannesburg (SAST)</option>\n                </select>\n                <button id=\"add-timezone-btn\" class=\"btn btn-add\">Add</button>\n            </div>\n\n            <!-- Clock Display Area -->\n            <div id=\"clocks-container\" class=\"clocks-container\">\n                <!-- Default timezones will be added here -->\n            </div>\n        </div>\n    </div>\n\n    <script src=\"clock-script.js\"></script>\n</body>\n</html>"
